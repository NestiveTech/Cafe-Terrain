<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Terrain - Menu</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @keyframes luxuryGradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    @keyframes fadeInLux {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sparkleRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f3ef;
      color: #2c2c2c;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        linear-gradient(180deg, rgba(212, 175, 55, 0.03) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .luxury-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(212, 175, 55, 0.02) 2px, rgba(212, 175, 55, 0.02) 4px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 40px;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      padding: 80px 20px 60px;
      margin-bottom: 80px;
      position: relative;
    }

    .ornament-top {
      width: 150px;
      height: 1px;
      background: #d4af37;
      margin: 0 auto 40px;
      position: relative;
    }

    .ornament-top::before,
    .ornament-top::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      background: #d4af37;
      top: -3.5px;
      transform: rotate(45deg);
    }

    .ornament-top::before { left: -12px; }
    .ornament-top::after { right: -12px; }

    .logo-wrapper {
      margin-bottom: 50px;
      animation: gentleFloat 5s ease-in-out infinite;
    }

    .logo {
      width: 160px;
      height: 160px;
      margin: 0 auto;
      background: linear-gradient(135deg, #ffffff 0%, #fafaf8 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      position: relative;
      border: 4px solid #d4af37;
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.12),
        inset 0 2px 8px rgba(255, 255, 255, 0.8);
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .logo::before {
      content: '';
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .logo::after {
      content: '';
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    .logo:hover {
      transform: scale(1.05);
      box-shadow: 
        0 12px 48px rgba(0, 0, 0, 0.15),
        inset 0 2px 8px rgba(255, 255, 255, 0.8);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      position: relative;
      z-index: 1;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #2c2c2c 0%, #d4af37 50%, #2c2c2c 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: luxuryGradient 10s ease infinite;
      margin-bottom: 20px;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: fadeInLux 1s ease;
    }

    .header p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      color: #8b7355;
      font-weight: 400;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-style: italic;
      margin-bottom: 30px;
      animation: fadeInLux 1s ease 0.3s both;
    }

    .ornament-divider {
      width: 60px;
      height: 1px;
      background: #d4af37;
      margin: 30px auto;
      position: relative;
    }

    .ornament-divider::before {
      content: '◆';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #d4af37;
      font-size: 0.8rem;
      background: #f5f3ef;
      padding: 0 12px;
    }

    .loading {
      text-align: center;
      padding: 100px 20px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 1.2s ease-in-out infinite;
      margin: 0 auto 25px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading p {
      color: #8b7355;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .menu-grid {
      display: grid;
      gap: 40px;
      animation: fadeInLux 0.8s ease;
    }

    .category-section {
      background: #ffffff;
      border: 2px solid #d4af37;
      overflow: hidden;
      transition: all 0.4s ease;
      animation: fadeInLux 0.8s ease;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .category-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
    }

    .category-section::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
    }

    .category-section:hover {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      transform: translateY(-4px);
    }

    .category-header {
      background: linear-gradient(135deg, #fafaf8 0%, #f5f3ef 100%);
      padding: 35px 45px;
      display: flex;
      align-items: center;
      gap: 25px;
      border-bottom: 2px solid #d4af37;
      position: relative;
    }

    .category-header::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #d4af37;
    }

    .category-icon {
      font-size: 3rem;
      filter: grayscale(0.3);
      animation: gentleFloat 4s ease-in-out infinite;
    }

    .category-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: #2c2c2c;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .menu-items {
      padding: 15px;
    }

    .menu-item {
      padding: 32px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      transition: all 0.3s ease;
      position: relative;
      background: #ffffff;
    }

    .menu-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: #d4af37;
      transition: width 0.3s ease;
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .menu-item:hover {
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.04) 0%, transparent 100%);
      padding-left: 42px;
    }

    .menu-item:hover::before {
      width: 4px;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: #2c2c2c;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .menu-item:hover .item-name {
      color: #8b7355;
      letter-spacing: 1px;
    }

    .item-description {
      color: #6b6b6b;
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 14px;
      font-weight: 300;
    }

    .item-price {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: #d4af37;
      white-space: nowrap;
      transition: all 0.3s ease;
      position: relative;
    }

    .item-price::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      height: 2px;
      background: #d4af37;
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .menu-item:hover .item-price {
      transform: scale(1.08);
      color: #8b7355;
    }

    .menu-item:hover .item-price::after {
      transform: scaleX(1);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: 1.5px solid;
      transition: all 0.3s ease;
    }

    .status-available {
      background: rgba(212, 175, 55, 0.08);
      color: #8b7355;
      border-color: #d4af37;
    }

    .status-unavailable {
      background: rgba(139, 115, 85, 0.06);
      color: #8b7355;
      border-color: rgba(139, 115, 85, 0.4);
    }

    .menu-item:hover .status-badge {
      transform: translateX(-5px);
      border-color: #8b7355;
    }

    .empty-message {
      text-align: center;
      padding: 80px 20px;
      color: #8b7355;
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 1px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 15px;
      margin-top: 70px;
      padding: 18px 45px;
      background: #ffffff;
      color: #2c2c2c;
      text-decoration: none;
      border: 2px solid #d4af37;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.4s ease;
      text-transform: uppercase;
      letter-spacing: 3px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .back-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: #d4af37;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.4s ease;
      z-index: -1;
    }

    .back-btn:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .back-btn:hover {
      color: #ffffff;
      border-color: #d4af37;
      box-shadow: 0 6px 24px rgba(212, 175, 55, 0.3);
    }

    .footer {
      text-align: center;
      padding: 80px 20px 40px;
      margin-top: 100px;
      border-top: 2px solid #d4af37;
      position: relative;
    }

    .footer::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: #d4af37;
      transform: translateX(-50%) rotate(45deg);
    }

    .footer strong {
      font-family: 'Playfair Display', serif;
      color: #2c2c2c;
      font-size: 1.5rem;
      display: block;
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .footer p {
      color: #8b7355;
      font-weight: 300;
      letter-spacing: 2px;
      font-size: 0.85rem;
    }

    .error-container {
      background: linear-gradient(135deg, rgba(139, 115, 85, 0.05), rgba(212, 175, 55, 0.03));
      border: 2px solid rgba(212, 175, 55, 0.4);
      padding: 70px 45px;
      text-align: center;
      margin: 70px 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .error-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: gentleFloat 3s ease-in-out infinite;
      color: #8b7355;
    }

    .error-message {
      color: #2c2c2c;
      font-size: 1.1rem;
      margin-bottom: 30px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .retry-btn {
      padding: 16px 40px;
      background: #ffffff;
      color: #2c2c2c;
      border: 2px solid #d4af37;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.4s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
    }

    .retry-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: #d4af37;
      transform: scaleX(0);
      transition: transform 0.4s ease;
      z-index: -1;
    }

    .retry-btn:hover::after {
      transform: scaleX(1);
    }

    .retry-btn:hover {
      color: #ffffff;
      box-shadow: 0 6px 24px rgba(212, 175, 55, 0.25);
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 20px;
      }

      .header {
        padding: 50px 20px 40px;
      }

      .header h1 {
        font-size: 2.8rem;
        letter-spacing: 1px;
      }

      .header p {
        font-size: 1rem;
        letter-spacing: 4px;
      }

      .logo {
        width: 120px;
        height: 120px;
      }

      .menu-item {
        flex-direction: column;
        align-items: flex-start;
        padding: 24px 20px;
      }

      .item-price {
        align-self: flex-start;
      }

      .category-header {
        padding: 28px 22px;
      }

      .category-title {
        font-size: 1.7rem;
      }

      .category-icon {
        font-size: 2.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="luxury-pattern"></div>
  
  <div class="container">
    <header class="header">
      <div class="ornament-top"></div>
      
      <div class="logo-wrapper">
        <div class="logo">
          <img src="assets/IMG-20251104-WA0038.jpg" alt="Cafe Terrain">
        </div>
      </div>
      
      <h1>Cafe Terrain</h1>
      <div class="ornament-divider"></div>
      <p>Fine Dining Experience</p>
    </header>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Preparing Menu</p>
    </div>

    <div class="menu-grid" id="menuContainer"></div>

    <div style="text-align: center;">
      <a href="index.html" class="back-btn">
        <span>←</span>
        <span>Return Home</span>
      </a>
    </div>

    <footer class="footer">
      <strong>Cafe Terrain</strong>
      <p>© 2025 All Rights Reserved</p>
    </footer>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw9nZs0MeIwlCb-FIR8AqjvPOG-s5THl9cfQ82Y8brh21BLeqFkKjUge2oLZKTZtWX0/exec';

    const categoryIcons = {
      'Coffee': '☕',
      'Starters': '🍟',
      'Pasta': '🍝',
      'Continental': '🍽️',
      'Dessert': '🍰',
      'Beverages': '🥤',
      'Snacks': '🍿'
    };

    async function loadMenu() {
      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();

        if (result.success && result.data) {
          renderMenu(result.data);
        } else {
          showError('Failed to load menu');
        }
      } catch (error) {
        console.error('Error loading menu:', error);
        showError('Unable to load menu. Please try again later.');
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function renderMenu(menuData) {
      const container = document.getElementById('menuContainer');
      container.innerHTML = '';

      const categories = Object.keys(menuData);

      if (categories.length === 0) {
        container.innerHTML = '<div class="empty-message">No menu items available at the moment.</div>';
        return;
      }

      categories.forEach((category, index) => {
        const categoryData = menuData[category];
        const items = categoryData.items || [];

        if (items.length === 0) return;

        const icon = categoryIcons[category] || '🍴';

        const section = document.createElement('div');
        section.className = 'category-section';
        section.style.animationDelay = `${index * 0.15}s`;

        section.innerHTML = `
          <div class="category-header">
            <span class="category-icon">${icon}</span>
            <span class="category-title">${category}</span>
          </div>
          <div class="menu-items">
            ${items.map(item => `
              <div class="menu-item">
                <div class="item-info">
                  <div class="item-name">${item.name}</div>
                  ${item.description ? `<div class="item-description">${item.description}</div>` : ''}
                  <span class="status-badge ${item.status === '✅' ? 'status-available' : 'status-unavailable'}">
                    <span>◆</span>
                    <span>${item.status === '✅' ? 'Available' : 'Unavailable'}</span>
                  </span>
                </div>
                <div class="item-price">₹${item.price}</div>
              </div>
            `).join('')}
          </div>
        `;

        container.appendChild(section);
      });
    }

    function showError(message) {
      const container = document.getElementById('menuContainer');
      container.innerHTML = `
        <div class="error-container">
          <div class="error-icon">⚠</div>
          <div class="error-message">${message}</div>
          <button onclick="location.reload()" class="retry-btn">
            Retry
          </button>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', loadMenu);
  </script>
</body>
</html>
