<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manager Dashboard - Cafe Terrain</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #E2725B;
      --accent-color: #d4af37;
      --success-color: #27ae60;
      --danger-color: #e74c3c;
      --warning-color: #E2725B;
      --info-color: #3498db;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #E2725B 0%, #8B4513 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    /* HEADER */
    .header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
      border: 3px solid #d4af37;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #E2725B;
      margin-bottom: 10px;
    }

    .header p {
      color: #8b7355;
      font-size: 1.1rem;
    }

    /* AUTH SECTION */
    .auth-section {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 500px;
      margin: 50px auto;
      text-align: center;
      border: 3px solid #d4af37;
    }

    .auth-section h2 {
      font-family: 'Playfair Display', serif;
      color: #E2725B;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    .input-group input {
      width: 100%;
      padding: 15px;
      border: 2px solid #d4af37;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .input-group input:focus {
      outline: none;
      border-color: #E2725B;
      box-shadow: 0 0 0 3px rgba(226, 114, 91, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #E2725B 0%, #8B4513 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(226, 114, 91, 0.4);
    }

    .login-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      border-left: 4px solid #c33;
    }

    /* DASHBOARD */
    .dashboard-container {
      display: none;
    }

    .dashboard-container.active {
      display: block;
    }

    .controls {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      flex-wrap: wrap;
      gap: 15px;
      border: 2px solid #d4af37;
    }

    .user-info {
      color: #333;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .user-email {
      color: #E2725B;
      font-weight: 700;
    }

    .controls-buttons {
      display: flex;
      gap: 10px;
    }

    .refresh-btn, .logout-btn {
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1rem;
    }

    .refresh-btn {
      background: linear-gradient(135deg, #E2725B 0%, #8B4513 100%);
      color: white;
    }

    .refresh-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(226, 114, 91, 0.4);
    }

    .logout-btn {
      background: #8b7355;
      color: white;
    }

    .logout-btn:hover {
      background: #6b5945;
      transform: translateY(-2px);
    }

    /* TAB NAVIGATION */
    .tab-navigation {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      border: 2px solid #d4af37;
    }

    .tab-btn {
      flex: 1;
      min-width: 150px;
      padding: 15px;
      background: white;
      border: 2px solid #E2725B;
      color: #E2725B;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 0.95rem;
    }

    .tab-btn:hover {
      background: rgba(226, 114, 91, 0.1);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #E2725B 0%, #8B4513 100%);
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* STATS DASHBOARD */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: all 0.3s;
      border-left: 5px solid;
      border: 2px solid #d4af37;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .stat-card.pending { border-left-color: var(--info-color); }
    .stat-card.preparing { border-left-color: var(--warning-color); }
    .stat-card.completed { border-left-color: var(--success-color); }
    .stat-card.total { border-left-color: var(--accent-color); }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .stat-icon {
      font-size: 2.5rem;
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #8b7355;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ORDERS SECTION */
    .orders-container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      border: 2px solid #d4af37;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #E2725B;
    }

    .filter-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 20px;
      border: 2px solid #E2725B;
      background: white;
      color: #E2725B;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .filter-btn:hover {
      background: #E2725B;
      color: white;
    }

    .filter-btn.active {
      background: #E2725B;
      color: white;
    }

    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .order-card {
      background: #fff5f3;
      border-radius: 12px;
      padding: 20px;
      border: 2px solid #d4af37;
      transition: all 0.3s;
    }

    .order-card.pending { border-left-color: var(--info-color); }
    .order-card.preparing { border-left-color: var(--warning-color); }
    .order-card.completed { border-left-color: var(--success-color); }
    .order-card.ready { border-left-color: var(--success-color); }

    .order-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e0e0e0;
    }

    .order-id {
      font-weight: 700;
      color: #E2725B;
      font-size: 1.1rem;
    }

    .table-badge {
      background: linear-gradient(135deg, #E2725B 0%, #8B4513 100%);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .order-details {
      margin-bottom: 15px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .detail-label {
      color: #8b7355;
      font-weight: 500;
    }

    .detail-value {
      color: #333;
      font-weight: 600;
    }

    .order-items {
      background: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: #555;
      line-height: 1.6;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge.pending {
      background: #e3f2fd;
      color: var(--info-color);
    }

    .status-badge.preparing {
      background: rgba(226, 114, 91, 0.1);
      color: var(--warning-color);
    }

    .status-badge.completed, .status-badge.ready {
      background: #e8f5e9;
      color: var(--success-color);
    }

    /* MENU MANAGEMENT */
    .menu-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1rem;
    }

    .btn-add {
      background: var(--success-color);
      color: white;
    }

    .btn-add:hover {
      background: #229954;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
    }

    .menu-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    .menu-table thead {
      background: linear-gradient(135deg, #E2725B 0%, #8B4513 100%);
      color: white;
    }

    .menu-table th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .menu-table td {
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    .menu-table tbody tr:hover {
      background: #fff5f3;
    }

    .table-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
      font-weight: 600;
    }

    .btn-edit {
      background: var(--info-color);
      color: white;
    }

    .btn-edit:hover {
      background: #2980b9;
    }

    .btn-delete {
      background: var(--danger-color);
      color: white;
    }

    .btn-delete:hover {
      background: #c0392b;
    }

    .btn-toggle {
      padding: 6px 15px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 0.85rem;
    }

    .btn-toggle.available {
      background: var(--success-color);
      color: white;
    }

    .btn-toggle.unavailable {
      background: var(--danger-color);
      color: white;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 3000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 15px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      border: 3px solid #d4af37;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }

    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #E2725B;
    }

    .close-modal {
      background: none;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      color: #999;
      transition: all 0.3s;
    }

    .close-modal:hover {
      color: var(--danger-color);
      transform: rotate(90deg);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #d4af37;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Montserrat', sans-serif;
      transition: all 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #E2725B;
      box-shadow: 0 0 0 3px rgba(226, 114, 91, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #E2725B 0%, #8B4513 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(226, 114, 91, 0.4);
    }

    /* LOADING */
    .loading {
      text-align: center;
      padding: 100px 20px;
      color: white;
      font-size: 1.2rem;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      background: white;
      padding: 60px 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      border: 2px solid #d4af37;
    }

    .empty-state h3 {
      font-family: 'Playfair Display', serif;
      color: #E2725B;
      font-size: 2rem;
      margin-bottom: 15px;
    }

    .empty-state p {
      color: #8b7355;
      font-size: 1.1rem;
    }

    /* CHANGE LOG */
    .log-table {
      width: 100%;
      border-collapse: collapse;
    }

    .log-table thead {
      background: linear-gradient(135deg, #E2725B 0%, #8B4513 100%);
      color: white;
    }

    .log-table th {
      padding: 12px;
      text-align: left;
      font-size: 0.9rem;
    }

    .log-table td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
    }

    .log-table tbody tr:hover {
      background: #fff5f3;
    }

    .action-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .action-add { background: #d4edda; color: #155724; }
    .action-update { background: #fff3cd; color: #856404; }
    .action-delete { background: #f8d7da; color: #721c24; }
    .action-toggleStatus { background: #d1ecf1; color: #0c5460; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .orders-grid {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .controls {
        flex-direction: column;
      }

      .controls-buttons {
        width: 100%;
      }

      .refresh-btn, .logout-btn {
        flex: 1;
      }

      .tab-navigation {
        flex-direction: column;
      }

      .menu-table, .log-table {
        font-size: 0.85rem;
      }

      .menu-table th,
      .menu-table td,
      .log-table th,
      .log-table td {
        padding: 10px 5px;
      }

      .table-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>👨‍💼 Manager Dashboard</h1>
      <p>Cafe Terrain - Complete Restaurant Management</p>
    </div>

    <!-- Authentication Section -->
    <div class="auth-section" id="authSection">
      <h2>Manager Login</h2>
      <div class="input-group">
        <label for="emailInput">Email Address</label>
        <input type="email" id="emailInput" placeholder="Enter your registered email" required>
      </div>
      <button class="login-btn" onclick="login()">
        <span id="loginBtnText">Login</span>
      </button>
      <div id="authError"></div>
    </div>

    <!-- Dashboard Section -->
    <div class="dashboard-container" id="dashboardContainer">
      <!-- Controls -->
      <div class="controls">
        <div class="user-info">
          Logged in as: <span class="user-email" id="userEmail"></span>
        </div>
        <div class="controls-buttons">
          <button class="refresh-btn" onclick="refreshCurrentTab()">
            🔄 Refresh
          </button>
          <button class="logout-btn" onclick="logout()">
            Logout
          </button>
        </div>
      </div>

      <!-- Tab Navigation -->
      <div class="tab-navigation">
        <button class="tab-btn active" onclick="switchTab('dashboard', this)">
          📊 Dashboard
        </button>
        <button class="tab-btn" onclick="switchTab('orders', this)">
          📋 All Orders
        </button>
        <button class="tab-btn" onclick="switchTab('menu', this)">
          🍽️ Menu Management
        </button>
        <button class="tab-btn" onclick="switchTab('changelog', this)">
          📝 Change Log
        </button>
      </div>

      <!-- Dashboard Tab -->
      <div id="dashboardTab" class="tab-content active">
        <div class="stats-grid" id="statsGrid"></div>
        
        <div class="orders-container">
          <div class="section-header">
            <h2 class="section-title">Recent Orders Overview</h2>
          </div>
          <div id="recentOrdersGrid"></div>
        </div>
      </div>

      <!-- Orders Tab -->
      <div id="ordersTab" class="tab-content">
        <div class="orders-container">
          <div class="section-header">
            <h2 class="section-title">All Orders</h2>
            <div class="filter-buttons">
              <button class="filter-btn active" onclick="filterAllOrders('all', this)">All</button>
              <button class="filter-btn" onclick="filterAllOrders('Pending', this)">Pending</button>
              <button class="filter-btn" onclick="filterAllOrders('Preparing', this)">Preparing</button>
              <button class="filter-btn" onclick="filterAllOrders('Completed', this)">Completed</button>
            </div>
          </div>
          <div id="allOrdersGrid"></div>
        </div>
      </div>

      <!-- Menu Management Tab -->
      <div id="menuTab" class="tab-content">
        <div class="orders-container">
          <div class="section-header">
            <h2 class="section-title">Menu Items</h2>
            <button class="action-btn btn-add" onclick="openAddModal()">
              ➕ Add New Item
            </button>
          </div>
          <div style="overflow-x: auto;">
            <table class="menu-table">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Product</th>
                  <th>Description</th>
                  <th>Price</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="menuTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Change Log Tab -->
      <div id="changelogTab" class="tab-content">
        <div class="orders-container">
          <div class="section-header">
            <h2 class="section-title">Recent Changes</h2>
          </div>
          <div style="overflow-x: auto;">
            <table class="log-table">
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>User</th>
                  <th>Action</th>
                  <th>Category</th>
                  <th>Product</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="changelogTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Menu Item Modal -->
  <div class="modal" id="menuModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add Menu Item</h2>
        <button class="close-modal" onclick="closeMenuModal()">×</button>
      </div>
      
      <form id="menuForm">
        <input type="hidden" id="itemRow">
        
        <div class="form-group">
          <label for="itemCategory">Category *</label>
          <select id="itemCategory" required>
            <option value="">Select Category</option>
            <option value="Coffee">☕ Coffee</option>
            <option value="Tea">🍵 Tea</option>
            <option value="Beverages">🥤 Beverages</option>
            <option value="Mocktails">🍹 Mocktails</option>
            <option value="Starters">🍟 Starters</option>
            <option value="Pasta">🍝 Pasta</option>
            <option value="Continental">🍽️ Continental</option>
            <option value="Dessert">🍰 Dessert</option>
            <option value="Snacks">🍿 Snacks</option>
          </select>
        </div>

        <div class="form-group">
          <label for="itemProduct">Product Name *</label>
          <input type="text" id="itemProduct" placeholder="e.g., Cappuccino" required>
        </div>

        <div class="form-group">
          <label for="itemDescription">Description</label>
          <textarea id="itemDescription" placeholder="Brief description (optional)"></textarea>
        </div>

        <div class="form-group">
          <label for="itemPrice">Price (₹) *</label>
          <input type="number" id="itemPrice" placeholder="e.g., 120" required min="0">
        </div>

        <div class="form-group">
          <label for="itemStatus">Status *</label>
          <select id="itemStatus" required>
            <option value="✅">✅ Available</option>
            <option value="❌">❌ Unavailable</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">
          <span id="submitBtnText">Add Item</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    // ⚠️ REPLACE WITH YOUR ACTUAL WEB APP URL
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw9nZs0MeIwlCb-FIR8AqjvPOG-s5THl9cfQ82Y8brh21BLeqFkKjUge2oLZKTZtWX0/exec';


    let userEmail = localStorage.getItem('managerEmail');
    let autoRefreshInterval;
    let allOrders = [];
    let allMenuItems = [];
    let allChanges = [];
    let currentFilter = 'all';
    let currentTab = 'dashboard';
    let editMode = false;
    let editRow = null;

    // Initialize on page load
    if (userEmail) {
      showDashboard();
      loadDashboard();
      startAutoRefresh();
    }

    // ===========================
    // AUTHENTICATION
    // ===========================
    async function login() {
      const email = document.getElementById('emailInput').value.trim();
      const loginBtn = document.querySelector('.login-btn');
      const loginBtnText = document.getElementById('loginBtnText');

      if (!email) {
        showError('Please enter your email address');
        return;
      }

      loginBtn.disabled = true;
      loginBtnText.textContent = 'Verifying...';

      try {
        const response = await fetch(`${SCRIPT_URL}?action=checkAuth&email=${encodeURIComponent(email)}&role=manager`);
        const result = await response.json();

        if (result.success && result.data.authorized) {
          localStorage.setItem('managerEmail', email);
          userEmail = email;
          showDashboard();
          loadDashboard();
          startAutoRefresh();
        } else {
          showError('❌ Access Denied. You are not authorized as Manager.');
        }
      } catch (error) {
        console.error('Login error:', error);
        showError('❌ Connection error. Please check your internet and try again.');
      } finally {
        loginBtn.disabled = false;
        loginBtnText.textContent = 'Login';
      }
    }

    function showError(message) {
      const authError = document.getElementById('authError');
      authError.innerHTML = `<div class="error-message">${message}</div>`;
      setTimeout(() => {
        authError.innerHTML = '';
      }, 5000);
    }

    function showDashboard() {
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('dashboardContainer').classList.add('active');
      document.getElementById('userEmail').textContent = userEmail;
    }

    function logout() {
      if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('managerEmail');
        stopAutoRefresh();
        location.reload();
      }
    }

    // ===========================
    // TAB MANAGEMENT
    // ===========================
    function switchTab(tab, button) {
      currentTab = tab;
      
      // Update active tab button
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');

      // Update active tab content
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      if (tab === 'dashboard') {
        document.getElementById('dashboardTab').classList.add('active');
        loadDashboard();
      } else if (tab === 'orders') {
        document.getElementById('ordersTab').classList.add('active');
        loadAllOrders();
      } else if (tab === 'menu') {
        document.getElementById('menuTab').classList.add('active');
        loadMenuItems();
      } else if (tab === 'changelog') {
        document.getElementById('changelogTab').classList.add('active');
        loadChangeLog();
      }
    }

    function refreshCurrentTab() {
      if (currentTab === 'dashboard') {
        loadDashboard();
      } else if (currentTab === 'orders') {
        loadAllOrders();
      } else if (currentTab === 'menu') {
        loadMenuItems();
      } else if (currentTab === 'changelog') {
        loadChangeLog();
      }
    }

    // ===========================
    // DASHBOARD
    // ===========================
    async function loadDashboard() {
      try {
        const [baristaResponse, kitchenResponse] = await Promise.all([
          fetch(`${SCRIPT_URL}?action=getBaristaOrders`),
          fetch(`${SCRIPT_URL}?action=getKitchenOrders`)
        ]);

        const baristaResult = await baristaResponse.json();
        const kitchenResult = await kitchenResponse.json();

        const baristaOrders = Array.isArray(baristaResult.data) ? baristaResult.data : [];
        const kitchenOrders = Array.isArray(kitchenResult.data) ? kitchenResult.data : [];

        allOrders = [...baristaOrders, ...kitchenOrders];

        renderDashboardStats();
        renderRecentOrders();
      } catch (error) {
        console.error('Load dashboard error:', error);
      }
    }

    function renderDashboardStats() {
      const statsGrid = document.getElementById('statsGrid');
      
      const pending = allOrders.filter(o => o.status === 'Pending').length;
      const preparing = allOrders.filter(o => o.status === 'Preparing').length;
      const completed = allOrders.filter(o => o.status === 'Completed' || o.status === 'Ready').length;
      const total = allOrders.length;

      statsGrid.innerHTML = `
        <div class="stat-card pending">
          <div class="stat-header">
            <div class="stat-icon">⏳</div>
          </div>
          <div class="stat-number" style="color: var(--info-color);">${pending}</div>
          <div class="stat-label">Pending Orders</div>
        </div>

        <div class="stat-card preparing">
          <div class="stat-header">
            <div class="stat-icon">🔥</div>
          </div>
          <div class="stat-number" style="color: var(--warning-color);">${preparing}</div>
          <div class="stat-label">Preparing</div>
        </div>

        <div class="stat-card completed">
          <div class="stat-header">
            <div class="stat-icon">✅</div>
          </div>
          <div class="stat-number" style="color: var(--success-color);">${completed}</div>
          <div class="stat-label">Completed</div>
        </div>

        <div class="stat-card total">
          <div class="stat-header">
            <div class="stat-icon">📊</div>
          </div>
          <div class="stat-number" style="color: var(--accent-color);">${total}</div>
          <div class="stat-label">Total Orders</div>
        </div>
      `;
    }

    function renderRecentOrders() {
      const grid = document.getElementById('recentOrdersGrid');
      
      if (allOrders.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>No Orders Yet</h3>
            <p>Orders will appear here once customers start placing them.</p>
          </div>
        `;
        return;
      }

      const recentOrders = allOrders.slice(-6).reverse();
      
      grid.innerHTML = `
        <div class="orders-grid">
          ${recentOrders.map(order => createOrderCard(order)).join('')}
        </div>
      `;
    }

    // ===========================
    // ALL ORDERS
    // ===========================
    async function loadAllOrders() {
      const grid = document.getElementById('allOrdersGrid');
      grid.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading all orders...</p></div>';

      try {
        const [baristaResponse, kitchenResponse] = await Promise.all([
          fetch(`${SCRIPT_URL}?action=getBaristaOrders`),
          fetch(`${SCRIPT_URL}?action=getKitchenOrders`)
        ]);

        const baristaResult = await baristaResponse.json();
        const kitchenResult = await kitchenResponse.json();

        const baristaOrders = Array.isArray(baristaResult.data) ? baristaResult.data : [];
        const kitchenOrders = Array.isArray(kitchenResult.data) ? kitchenResult.data : [];

        allOrders = [...baristaOrders, ...kitchenOrders];

        filterAllOrders(currentFilter);
      } catch (error) {
        console.error('Load orders error:', error);
        grid.innerHTML = `
          <div class="empty-state">
            <h3>❌ Error Loading Orders</h3>
            <p>Unable to load orders. Please try again.</p>
          </div>
        `;
      }
    }

    function filterAllOrders(status, clickedButton) {
      currentFilter = status;
      
      if (clickedButton) {
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.classList.remove('active');
        });
        clickedButton.classList.add('active');
      }

      let filteredOrders = allOrders;
      if (status !== 'all') {
        filteredOrders = allOrders.filter(order => order.status === status);
      }

      const grid = document.getElementById('allOrdersGrid');
      
      if (filteredOrders.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>No ${status === 'all' ? '' : status} Orders</h3>
            <p>No orders found with this status.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = `
        <div class="orders-grid">
          ${filteredOrders.map(order => createOrderCard(order)).join('')}
        </div>
      `;
    }

    function createOrderCard(order) {
      const timestamp = new Date(order.timestamp).toLocaleString();
      const status = order.status || 'Pending';
      const department = order.kotId?.includes('BARISTA') ? 'Barista' : 'Kitchen';

      return `
        <div class="order-card ${status.toLowerCase()}">
          <div class="order-header">
            <div class="order-id">${department === 'Barista' ? '☕' : '🍳'} ${order.kotId}</div>
            <div class="table-badge">Table ${order.table}</div>
          </div>

          <div class="order-details">
            <div class="detail-row">
              <span class="detail-label">Order ID:</span>
              <span class="detail-value">${order.orderId}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Department:</span>
              <span class="detail-value">${department}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Time:</span>
              <span class="detail-value">${timestamp}</span>
            </div>
          </div>

          <div class="order-items">
            <strong>Items:</strong><br>
            ${order.items}
          </div>

          <span class="status-badge ${status.toLowerCase()}">
            ${status === 'Pending' ? '⏳' : status === 'Preparing' ? '🔥' : '✅'} ${status}
          </span>
        </div>
      `;
    }

    // ===========================
    // MENU MANAGEMENT
    // ===========================
    async function loadMenuItems() {
      const tbody = document.getElementById('menuTableBody');
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">Loading menu items...</td></tr>';

      try {
        const response = await fetch(`${SCRIPT_URL}?action=getAll`);
        const result = await response.json();

        if (result.success) {
          allMenuItems = Array.isArray(result.data) ? result.data : [];
          renderMenuTable();
        } else {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:#e74c3c;">Failed to load menu items</td></tr>`;
        }
      } catch (error) {
        console.error('Load menu error:', error);
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:#e74c3c;">Error loading menu</td></tr>`;
      }
    }

    function renderMenuTable() {
      const tbody = document.getElementById('menuTableBody');
      
      if (allMenuItems.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">No menu items found</td></tr>';
        return;
      }

      tbody.innerHTML = allMenuItems.map(item => {
        const isAvailable = item.status === '✅';
        const itemJson = JSON.stringify(item).replace(/"/g, '&quot;');
        
        return `
          <tr>
            <td>${item.category || 'N/A'}</td>
            <td><strong>${item.product || 'N/A'}</strong></td>
            <td style="max-width: 200px;">${item.description || '-'}</td>
            <td><strong>₹${item.price || 0}</strong></td>
            <td>
              <button class="btn-toggle ${isAvailable ? 'available' : 'unavailable'}"
                      onclick="toggleItemStatus(${item.row}, '${isAvailable ? '❌' : '✅'}')">
                ${item.status || '✅'}
              </button>
            </td>
            <td>
              <div class="table-actions">
                <button class="btn-icon btn-edit" onclick='openEditModal(${itemJson})'>
                  ✏️ Edit
                </button>
                <button class="btn-icon btn-delete" onclick="deleteItem(${item.row})">
                  🗑️ Delete
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function openAddModal() {
      editMode = false;
      document.getElementById('modalTitle').textContent = 'Add Menu Item';
      document.getElementById('submitBtnText').textContent = 'Add Item';
      document.getElementById('menuForm').reset();
      document.getElementById('menuModal').classList.add('active');
    }

    function openEditModal(item) {
      editMode = true;
      editRow = item.row;
      
      document.getElementById('modalTitle').textContent = 'Edit Menu Item';
      document.getElementById('submitBtnText').textContent = 'Update Item';
      
      document.getElementById('itemRow').value = item.row;
      document.getElementById('itemCategory').value = item.category;
      document.getElementById('itemProduct').value = item.product;
      document.getElementById('itemDescription').value = item.description || '';
      document.getElementById('itemPrice').value = item.price;
      document.getElementById('itemStatus').value = item.status;
      
      document.getElementById('menuModal').classList.add('active');
    }

    function closeMenuModal() {
      document.getElementById('menuModal').classList.remove('active');
      document.getElementById('menuForm').reset();
      editMode = false;
      editRow = null;
    }

    document.getElementById('menuForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.querySelector('.submit-btn');
      const submitBtnText = document.getElementById('submitBtnText');
      const originalText = submitBtnText.textContent;

      submitBtn.disabled = true;
      submitBtnText.textContent = editMode ? 'Updating...' : 'Adding...';

      const payload = {
        action: editMode ? 'update' : 'add',
        userEmail: userEmail,
        category: document.getElementById('itemCategory').value,
        product: document.getElementById('itemProduct').value,
        description: document.getElementById('itemDescription').value,
        price: parseFloat(document.getElementById('itemPrice').value),
        status: document.getElementById('itemStatus').value
      };

      if (editMode) {
        payload.row = editRow;
      }

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          alert(`✅ Item ${editMode ? 'updated' : 'added'} successfully!`);
          closeMenuModal();
          loadMenuItems();
        } else {
          alert(`❌ Error: ${result.message}`);
        }
      } catch (error) {
        console.error('Submit error:', error);
        alert('❌ Failed to submit. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtnText.textContent = originalText;
      }
    });

    async function toggleItemStatus(row, newStatus) {
      if (!confirm(`Change item status to ${newStatus === '✅' ? 'Available' : 'Unavailable'}?`)) {
        return;
      }

      try {
        const payload = {
          action: 'toggleStatus',
          userEmail: userEmail,
          row: row,
          status: newStatus
        };

        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          alert('✅ Status updated successfully');
          loadMenuItems();
        } else {
          alert(`❌ Error: ${result.message}`);
        }
      } catch (error) {
        console.error('Toggle status error:', error);
        alert('❌ Failed to update status');
      }
    }

    async function deleteItem(row) {
      if (!confirm('⚠️ Are you sure you want to delete this item?\n\nThis action cannot be undone.')) {
        return;
      }

      try {
        const payload = {
          action: 'delete',
          userEmail: userEmail,
          row: row
        };

        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          alert('✅ Item deleted successfully');
          loadMenuItems();
        } else {
          alert(`❌ Error: ${result.message}`);
        }
      } catch (error) {
        console.error('Delete error:', error);
        alert('❌ Failed to delete item');
      }
    }

    // ===========================
    // CHANGE LOG
    // ===========================
    async function loadChangeLog() {
      const tbody = document.getElementById('changelogTableBody');
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">Loading change log...</td></tr>';

      try {
        const payload = {
          action: 'getRecentChanges'
        };

        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          allChanges = Array.isArray(result.data) ? result.data : [];
          renderChangeLog();
        } else {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:#e74c3c;">Failed to load change log</td></tr>`;
        }
      } catch (error) {
        console.error('Load changelog error:', error);
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:#e74c3c;">Error loading change log</td></tr>`;
      }
    }

    function renderChangeLog() {
      const tbody = document.getElementById('changelogTableBody');
      
      if (allChanges.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">No changes recorded yet</td></tr>';
        return;
      }

      tbody.innerHTML = allChanges.map(change => {
        const timestamp = new Date(change.timestamp).toLocaleString();
        return `
          <tr>
            <td>${timestamp}</td>
            <td>${change.user || 'Unknown'}</td>
            <td><span class="action-badge action-${change.action}">${change.action}</span></td>
            <td>${change.category || '-'}</td>
            <td>${change.product || '-'}</td>
            <td>${change.status || '-'}</td>
          </tr>
        `;
      }).join('');
    }

    // ===========================
    // AUTO-REFRESH
    // ===========================
    function startAutoRefresh() {
      autoRefreshInterval = setInterval(() => {
        if (currentTab === 'dashboard') {
          loadDashboard();
        } else if (currentTab === 'orders') {
          loadAllOrders();
        }
      }, 30000);
    }

    function stopAutoRefresh() {
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
      }
    }

    document.getElementById('emailInput')?.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        login();
      }
    });
  </script>
</body>
</html>
