<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Terrain Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #8B4513;
      --secondary-color: #E2725B;
      --terracotta: #E2725B;
      --terracotta-dark: #C3592B;
      --terracotta-light: #F0E0D0;
      --text-color: #5D4037;
      --light-bg: #FFF8F0;
      --border-color: #E7CEB9;
      --shadow: 0 2px 8px rgba(139, 69, 19, 0.15);
      --shadow-hover: 0 4px 16px rgba(139, 69, 19, 0.25);
      --available-color: #6B8E23;
      --unavailable-color: #C3592B;
    }

    /* MOBILE-FIRST BASE STYLES */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: var(--text-color);
      background: linear-gradient(135deg, #FFF8F0 0%, #F0E0D0 100%);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
      padding: 15px;
    }

    /* Header Styles with Shimmer Effect */
    .header {
      text-align: center;
      padding: 20px 15px 20px;
      background: linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-dark) 100%);
      color: white;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: var(--shadow-hover);
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="80" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="50" cy="50" r="1.5" fill="rgba(255,255,255,0.1)"/></svg>');
      background-size: 50px 50px;
      opacity: 0.3;
    }

    .header::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation: shimmer 8s linear infinite;
    }

    @keyframes shimmer {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Logo */
    .logo-container {
      margin-bottom: 15px;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 12px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
      padding: 5px;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .header-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1.5px;
      position: relative;
      z-index: 1;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      font-family: 'Georgia', serif;
    }

    .header-subtitle {
      font-size: 1rem;
      opacity: 0.95;
      font-weight: 300;
      margin-bottom: 15px;
      position: relative;
      z-index: 1;
      letter-spacing: 0.5px;
    }

    /* Date/Time Display */
    .datetime-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .date-display, .time-display {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      opacity: 0.95;
    }

    .date-display::before {
      content: '📅';
      font-size: 1rem;
    }

    .time-display::before {
      content: '🕐';
      font-size: 1rem;
    }

    .live-time {
      font-weight: 600;
      letter-spacing: 0.5px;
      font-family: 'Courier New', monospace;
    }

    /* Last Updated Indicator */
    .last-updated {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
    }

    .refresh-indicator {
      width: 10px;
      height: 10px;
      background: #90EE90;
      border-radius: 50%;
      animation: pulse 2s infinite;
      box-shadow: 0 0 5px rgba(144, 238, 144, 0.5);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px 15px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 15px;
      border: 3px solid var(--border-color);
      border-top-color: var(--terracotta);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      text-align: center;
      padding: 30px 15px;
      color: var(--terracotta-dark);
      font-size: 1rem;
    }

    /* Menu Container */
    .menu-container {
      display: none;
      transition: opacity 0.3s ease;
    }

    .menu-container.loaded {
      display: block;
    }

    .menu-container.updating {
      opacity: 0.7;
    }

    /* Category Section */
    .category-section {
      margin-bottom: 25px;
      background: white;
      border-radius: 12px;
      padding: 20px 15px;
      box-shadow: var(--shadow);
      position: relative;
      border: 2px solid var(--border-color);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .category-section:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .category-section.unavailable {
      opacity: 0.6;
      background: var(--terracotta-light);
    }

    .category-section.unavailable::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(195, 89, 43, 0.05) 10px,
        rgba(195, 89, 43, 0.05) 20px
      );
      pointer-events: none;
      border-radius: 12px;
    }

    .category-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--terracotta);
    }

    .category-title {
      font-size: 1.4rem;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      margin: 0;
      font-family: 'Georgia', serif;
    }

    .category-title::before {
      content: '';
      width: 6px;
      height: 24px;
      background: linear-gradient(180deg, var(--terracotta) 0%, var(--terracotta-dark) 100%);
      margin-right: 10px;
      border-radius: 3px;
    }

    .category-status-badge {
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 2px solid;
      align-self: flex-start;
    }

    .category-status-badge.available {
      background-color: #F0F8E8;
      color: var(--available-color);
      border-color: var(--available-color);
    }

    .category-status-badge.unavailable {
      background-color: #FFF0ED;
      color: var(--unavailable-color);
      border-color: var(--unavailable-color);
    }

    /* Menu List */
    .menu-list {
      list-style: none;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 15px 0;
      border-bottom: 1px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .menu-item:active {
      background: linear-gradient(90deg, transparent 0%, rgba(226, 114, 91, 0.08) 50%, transparent 100%);
    }

    .menu-item.unavailable {
      opacity: 0.5;
    }

    .menu-item.unavailable .item-name {
      text-decoration: line-through;
    }

    .item-info {
      flex: 1;
    }

    .item-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 5px;
    }

    .item-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary-color);
      line-height: 1.3;
    }

    .status-badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      border: 1.5px solid;
      align-self: flex-start;
    }

    .status-badge.available {
      background-color: #F0F8E8;
      color: var(--available-color);
      border-color: var(--available-color);
    }

    .status-badge.unavailable {
      background-color: #FFF0ED;
      color: var(--unavailable-color);
      border-color: var(--unavailable-color);
    }

    .item-description {
      color: #8D6E63;
      font-size: 0.9rem;
      margin-top: 5px;
      line-height: 1.4;
    }

    .item-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--terracotta);
      white-space: nowrap;
    }

    /* Google Review Section */
    .review-section {
      background: white;
      border-radius: 12px;
      padding: 30px 20px;
      margin-top: 30px;
      margin-bottom: 30px;
      box-shadow: var(--shadow);
      text-align: center;
      border: 2px solid var(--border-color);
    }

    .review-title {
      font-size: 1.5rem;
      color: var(--primary-color);
      margin-bottom: 10px;
      font-family: 'Georgia', serif;
      font-weight: 700;
    }

    .review-subtitle {
      color: #8D6E63;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .qr-code-box {
      background: white;
      padding: 15px;
      border-radius: 12px;
      border: 3px solid var(--terracotta);
      box-shadow: 0 4px 12px rgba(226, 114, 91, 0.2);
      display: inline-block;
    }

    .qr-code-img {
      width: 180px;
      height: 180px;
      display: block;
    }

    .review-text {
      font-size: 1rem;
      color: var(--text-color);
      font-weight: 600;
      margin-top: 10px;
    }

    .review-instruction {
      font-size: 0.9rem;
      color: #8D6E63;
      margin-top: 8px;
    }

    .stars {
      font-size: 1.8rem;
      color: #FFD700;
      letter-spacing: 3px;
      margin: 10px 0;
    }

    /* TABLET - 768px+ */
    @media (min-width: 768px) {
      .container {
        padding: 20px;
        max-width: 900px;
      }

      .header {
        padding: 35px 25px 28px;
        border-radius: 14px;
        margin-bottom: 35px;
      }

      .logo {
        width: 120px;
        height: 120px;
        border: 4px solid rgba(255, 255, 255, 0.3);
      }

      .header-title {
        font-size: 2.2rem;
        letter-spacing: 2px;
      }

      .header-subtitle {
        font-size: 1.15rem;
        margin-bottom: 18px;
      }

      .last-updated {
        top: 15px;
        right: 15px;
      }

      .datetime-container {
        flex-direction: row;
        justify-content: space-between;
        gap: 20px;
        padding: 14px 20px;
      }

      .date-display {
        order: 1;
      }

      .time-display {
        order: 2;
      }

      .date-display, .time-display {
        font-size: 0.95rem;
      }

      .category-section {
        padding: 25px;
        margin-bottom: 35px;
        border-radius: 14px;
      }

      .category-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .category-title {
        font-size: 1.75rem;
      }

      .menu-item {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
        gap: 15px;
        padding: 18px 0;
      }

      .menu-item:hover {
        background: linear-gradient(90deg, transparent 0%, rgba(226, 114, 91, 0.05) 50%, transparent 100%);
        padding-left: 10px;
        padding-right: 10px;
        margin-left: -10px;
        margin-right: -10px;
        border-radius: 8px;
      }

      .item-header {
        flex-direction: row;
        align-items: baseline;
        gap: 12px;
      }

      .item-name {
        font-size: 1.15rem;
      }

      .item-price {
        font-size: 1.25rem;
        padding-left: 15px;
      }

      .review-section {
        padding: 40px 30px;
        border-radius: 14px;
      }

      .review-title {
        font-size: 1.8rem;
      }

      .qr-code-img {
        width: 200px;
        height: 200px;
      }
    }

    /* DESKTOP - 1024px+ */
    @media (min-width: 1024px) {
      .header {
        padding: 40px 30px 30px;
        border-radius: 16px;
        margin-bottom: 40px;
      }

      .logo {
        width: 130px;
        height: 130px;
      }

      .header-title {
        font-size: 2.5rem;
      }

      .header-subtitle {
        font-size: 1.2rem;
        margin-bottom: 20px;
      }

      .datetime-container {
        padding: 15px 25px;
        border-radius: 12px;
      }

      .date-display, .time-display {
        font-size: 1rem;
      }

      .category-section {
        padding: 30px;
        margin-bottom: 50px;
        border-radius: 16px;
      }

      .category-title {
        font-size: 2rem;
      }

      .category-title::before {
        width: 8px;
        height: 32px;
        margin-right: 15px;
      }

      .menu-item {
        padding: 20px 0;
      }

      .item-name {
        font-size: 1.2rem;
      }

      .item-price {
        font-size: 1.3rem;
      }

      .review-section {
        padding: 50px 40px;
        border-radius: 16px;
      }

      .review-title {
        font-size: 2rem;
      }

      .qr-code-img {
        width: 220px;
        height: 220px;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .menu-item:hover {
        background: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="last-updated">
        <span class="refresh-indicator"></span>
      </div>
      
      <div class="logo-container">
        <div class="logo">
          <img src="assets/IMG-20251104-WA0038.jpg" alt="Cafe Terrain Logo">
        </div>
      </div>
      
      <h1 class="header-title">Cafe Terrain</h1>
      <p class="header-subtitle">Our Menu</p>
      
      <div class="datetime-container">
        <div class="date-display">
          <span id="current-date" class="live-time">Loading...</span>
        </div>
        <div class="time-display">
          <span id="current-time" class="live-time">Loading...</span>
        </div>
      </div>
    </header>
    
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading menu...</p>
    </div>
    
    <div id="error" class="error" style="display: none;">
      <p>Unable to load menu. Please try again later.</p>
    </div>
    
    <div id="menu-container" class="menu-container"></div>

    <!-- Google Review QR Code Section -->
    <div class="review-section">
      <h2 class="review-title">Love Our Food? Share Your Experience!</h2>
      <p class="review-subtitle">Scan the QR code to leave us a Google review</p>
      
      <div class="qr-container">
        <div class="stars">⭐⭐⭐⭐⭐</div>
        <div class="qr-code-box">
          <img src="assets/brown_qr.png" 
               alt="Google Review QR Code" 
               class="qr-code-img">
        </div>
        <p class="review-text">Scan & Review</p>
        <p class="review-instruction">Open your camera app and point it at the QR code</p>
      </div>
    </div>
  </div>
  
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw9nZs0MeIwlCb-FIR8AqjvPOG-s5THl9cfQ82Y8brh21BLeqFkKjUge2oLZKTZtWX0/exec';
    const REFRESH_INTERVAL = 5000;
    
    let refreshTimer = null;
    let clockTimer = null;

    function updateDateTime() {
      const now = new Date();
      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const dateString = now.toLocaleDateString('en-IN', dateOptions);
      const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
      const timeString = now.toLocaleTimeString('en-IN', timeOptions);
      document.getElementById('current-date').textContent = dateString;
      document.getElementById('current-time').textContent = timeString;
    }

    function startClock() {
      updateDateTime();
      clockTimer = setInterval(updateDateTime, 1000);
    }

    function formatPrice(price, priceText) {
      if (priceText && priceText.includes('₹')) return priceText;
      if (price && price > 0) return `₹ ${price}`;
      return priceText || 'Price not available';
    }

    function isAvailable(status) {
      return status === '✅' || status === '' || status.toLowerCase().includes('available');
    }

    function createMenuItem(item) {
      const available = isAvailable(item.status);
      const availabilityClass = available ? 'available' : 'unavailable';
      const menuItemClass = available ? '' : 'unavailable';
      
      return `
        <li class="menu-item ${menuItemClass}">
          <div class="item-info">
            <div class="item-header">
              <span class="item-name">${item.name}</span>
              <span class="status-badge ${availabilityClass}">
                ${available ? '✅' : '❎'}
              </span>
            </div>
            ${item.description ? `<p class="item-description">${item.description}</p>` : ''}
          </div>
          <span class="item-price">${formatPrice(item.price, item.priceText)}</span>
        </li>
      `;
    }

    function createCategorySection(category, categoryData) {
      const items = categoryData.items;
      const categoryStatus = categoryData.categoryStatus;
      const isCategoryAvailable = isAvailable(categoryStatus);
      const categoryClass = isCategoryAvailable ? '' : 'unavailable';
      const statusClass = isCategoryAvailable ? 'available' : 'unavailable';
      
      return `
        <section class="category-section ${categoryClass}">
          <div class="category-header">
            <h2 class="category-title">${category}</h2>
            <span class="category-status-badge ${statusClass}">
              ${isCategoryAvailable ? '✅ Available' : '❎ Unavailable'}
            </span>
          </div>
          <ul class="menu-list">
            ${items.map(item => createMenuItem(item)).join('')}
          </ul>
        </section>
      `;
    }

    function renderMenu(menuData, isInitialLoad = false) {
      const container = document.getElementById('menu-container');
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      
      const categoryOrder = ['Coffee', 'Starters', 'Pasta', 'Continental', 'Dessert'];
      const categories = Object.keys(menuData).sort((a, b) => {
        const indexA = categoryOrder.indexOf(a);
        const indexB = categoryOrder.indexOf(b);
        if (indexA !== -1 && indexB !== -1) return indexA - indexB;
        if (indexA !== -1) return -1;
        if (indexB !== -1) return 1;
        return a.localeCompare(b);
      });
      
      const html = categories.map(category => createCategorySection(category, menuData[category])).join('');
      
      if (!isInitialLoad) {
        container.classList.add('updating');
        setTimeout(() => {
          container.innerHTML = html;
          container.classList.remove('updating');
        }, 200);
      } else {
        container.innerHTML = html;
        loadingEl.style.display = 'none';
        errorEl.style.display = 'none';
        container.classList.add('loaded');
      }
    }

    function showError(isInitialLoad = false) {
      if (isInitialLoad) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('menu-container').style.display = 'none';
      }
    }

    async function fetchMenu(isInitialLoad = false) {
      try {
        const response = await fetch(SCRIPT_URL);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const result = await response.json();
        if (result.success && result.data) {
          renderMenu(result.data, isInitialLoad);
        } else {
          showError(isInitialLoad);
        }
      } catch (error) {
        console.error('Fetch Error:', error);
        showError(isInitialLoad);
      }
    }

    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => fetchMenu(false), REFRESH_INTERVAL);
    }

    document.addEventListener('DOMContentLoaded', () => {
      startClock();
      fetchMenu(true);
      startAutoRefresh();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(refreshTimer);
        clearInterval(clockTimer);
      } else {
        startClock();
        fetchMenu(false);
        startAutoRefresh();
      }
    });
  </script>
</body>
</html>
