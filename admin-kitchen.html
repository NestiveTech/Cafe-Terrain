<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Terrain - Kitchen Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #8B4513;
      --terracotta: #E2725B;
      --terracotta-dark: #C3592B;
      --success: #28a745;
      --danger: #dc3545;
      --warning: #ffc107;
      --light-bg: #FFF8F0;
      --border-color: #E7CEB9;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #FFF8F0 0%, #F0E0D0 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-dark) 100%);
      color: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
      text-align: center;
      position: relative;
    }

    .header-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
      padding: 5px;
    }

    .header-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
      font-family: 'Georgia', serif;
    }

    .header .role-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .header p {
      opacity: 0.9;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--terracotta);
      color: white;
    }

    .btn-primary:hover {
      background: var(--terracotta-dark);
      transform: translateY(-2px);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
      padding: 8px 16px;
      font-size: 0.9rem;
    }

    .btn-warning {
      background: var(--warning);
      color: #333;
      padding: 8px 16px;
      font-size: 0.9rem;
    }

    .search-box {
      flex: 1;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
    }

    .table-container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(139, 69, 19, 0.15);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background: var(--light-bg);
      font-weight: 600;
      color: var(--primary-color);
    }

    tr:hover {
      background: var(--light-bg);
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-available {
      background: #d4edda;
      color: var(--success);
    }

    .status-unavailable {
      background: #f8d7da;
      color: var(--danger);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      color: var(--primary-color);
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #999;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--primary-color);
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border-color);
      border-top-color: var(--terracotta);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #d4edda;
      color: var(--success);
      border: 1px solid var(--success);
    }

    .alert-danger {
      background: #f8d7da;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    @media (max-width: 768px) {
      .action-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        max-width: 100%;
      }

      table {
        font-size: 0.9rem;
      }

      th, td {
        padding: 10px;
      }

      .header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-logo">
        <img src="assets/IMG-20251104-WA0038.jpg" alt="Cafe Terrain Logo">
      </div>
      <span class="role-badge">👨‍🍳 KITCHEN</span>
      <h1>Cafe Terrain</h1>
      <p>Food & Kitchen Management</p>
    </header>

    <div class="alert alert-success" id="successAlert"></div>
    <div class="alert alert-danger" id="errorAlert"></div>

    <div class="action-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search food items...">
      </div>
      <button class="btn btn-primary" onclick="openAddModal()">
        ➕ Add Food Item
      </button>
    </div>

    <div class="table-container">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading kitchen menu...</p>
      </div>

      <table id="menuTable" style="display: none;">
        <thead>
          <tr>
            <th>SL No.</th>
            <th>Category</th>
            <th>Product</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="menuTableBody">
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal" id="itemModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add Food Item</h2>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <form id="itemForm">
        <input type="hidden" id="itemId">
        <input type="hidden" id="itemRow">

        <div class="form-group">
          <label for="category">Category *</label>
          <select id="category" required>
            <option value="">Select Category</option>
            <option value="Starters">Starters</option>
            <option value="Pasta">Pasta</option>
            <option value="Continental">Continental</option>
            <option value="Dessert">Dessert</option>
          </select>
        </div>

        <div class="form-group">
          <label for="product">Product Name *</label>
          <input type="text" id="product" required placeholder="Enter product name">
        </div>

        <div class="form-group">
          <label for="price">Price (₹) *</label>
          <input type="number" id="price" required placeholder="Enter price" min="0">
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status">
            <option value="✅">✅ Available</option>
            <option value="❎">❎ Unavailable</option>
          </select>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 30px;">
          <button type="submit" class="btn btn-success" style="flex: 1;">
            💾 Save Item
          </button>
          <button type="button" class="btn btn-danger" onclick="closeModal()" style="flex: 1;">
            ❌ Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw9nZs0MeIwlCb-FIR8AqjvPOG-s5THl9cfQ82Y8brh21BLeqFkKjUge2oLZKTZtWX0/exec';
    const KITCHEN_CATEGORIES = ['Starters', 'Pasta', 'Continental', 'Dessert'];
    let menuData = [];

    async function loadMenuItems() {
      try {
        const response = await fetch(SCRIPT_URL + '?action=getAll');
        const result = await response.json();
        
        if (result.success) {
          menuData = result.data.filter(item => KITCHEN_CATEGORIES.includes(item.category));
          renderTable(menuData);
        } else {
          showAlert('error', 'Failed to load items');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('error', 'Failed to load items');
      } finally {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('menuTable').style.display = 'table';
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById('menuTableBody');
      tbody.innerHTML = '';

      data.forEach((item, index) => {
        const row = tbody.insertRow();
        row.innerHTML = `
          <td>${item.slNo}</td>
          <td>${item.category}</td>
          <td>${item.product}</td>
          <td>₹ ${item.price}</td>
          <td>
            <span class="status-badge ${item.status === '✅' ? 'status-available' : 'status-unavailable'}">
              ${item.status} ${item.status === '✅' ? 'Available' : 'Unavailable'}
            </span>
          </td>
          <td class="actions">
            
            <button class="btn ${item.status === '✅' ? 'btn-warning' : 'btn-success'}" 
                    onclick="toggleStatus(${index})">
              ${item.status === '✅' ? '🔒 Disable' : '✓ Enable'}
            </button>
            
          </td>
        `;
      });
    }
    // <button class="btn btn-warning" onclick="editItem(${index})">✏️ Edit</button>
// <button class="btn btn-danger" onclick="deleteItem(${index})">🗑️ Delete</button>
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const filtered = menuData.filter(item => 
        item.product.toLowerCase().includes(searchTerm) ||
        item.category.toLowerCase().includes(searchTerm)
      );
      renderTable(filtered);
    });

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add Food Item';
      document.getElementById('itemForm').reset();
      document.getElementById('itemId').value = '';
      document.getElementById('itemRow').value = '';
      document.getElementById('itemModal').classList.add('active');
    }

    function editItem(index) {
      const item = menuData[index];
      document.getElementById('modalTitle').textContent = 'Edit Food Item';
      document.getElementById('itemId').value = item.slNo;
      document.getElementById('itemRow').value = item.row;
      document.getElementById('category').value = item.category;
      document.getElementById('product').value = item.product;
      document.getElementById('price').value = item.price;
      document.getElementById('status').value = item.status;
      document.getElementById('itemModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.remove('active');
    }

    document.getElementById('itemForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const itemId = document.getElementById('itemId').value;
      const row = document.getElementById('itemRow').value;
      const action = itemId ? 'update' : 'add';
      
      const data = {
        action: action,
        slNo: itemId || (menuData.length + 1),
        row: row,
        category: document.getElementById('category').value,
        product: document.getElementById('product').value,
        price: document.getElementById('price').value,
        status: document.getElementById('status').value
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
          showAlert('success', `Item ${action === 'add' ? 'added' : 'updated'} successfully!`);
          closeModal();
          loadMenuItems();
        } else {
          showAlert('error', result.message || 'Operation failed');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('error', 'Operation failed');
      }
    });

    async function toggleStatus(index) {
      const item = menuData[index];
      const newStatus = item.status === '✅' ? '❎' : '✅';
      
      if (!confirm(`Are you sure you want to ${newStatus === '✅' ? 'enable' : 'disable'} this item?`)) {
        return;
      }

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'toggleStatus',
            row: item.row,
            status: newStatus
          })
        });
        
        const result = await response.json();
        
        if (result.success) {
          showAlert('success', 'Status updated successfully!');
          loadMenuItems();
        } else {
          showAlert('error', 'Failed to update status');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('error', 'Failed to update status');
      }
    }

    async function deleteItem(index) {
      const item = menuData[index];
      
      if (!confirm(`Are you sure you want to delete "${item.product}"?`)) {
        return;
      }

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'delete',
            row: item.row
          })
        });
        
        const result = await response.json();
        
        if (result.success) {
          showAlert('success', 'Item deleted successfully!');
          loadMenuItems();
        } else {
          showAlert('error', 'Failed to delete item');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('error', 'Failed to delete item');
      }
    }

    function showAlert(type, message) {
      const alertId = type === 'success' ? 'successAlert' : 'errorAlert';
      const alert = document.getElementById(alertId);
      alert.textContent = message;
      alert.classList.add('show');
      
      setTimeout(() => {
        alert.classList.remove('show');
      }, 5000);
    }

    document.addEventListener('DOMContentLoaded', loadMenuItems);
  </script>
</body>
</html>
