<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Terrain - Welcome</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #8B4513;
      --terracotta: #E2725B;
      --terracotta-dark: #C3592B;
      --terracotta-light: #F0E0D0;
      --text-color: #5D4037;
      --light-bg: #FFF8F0;
    }

    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #FFF8F0 0%, #F0E0D0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      width: 100%;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      margin-bottom: 60px;
      animation: fadeInDown 0.8s ease-out;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-container {
      margin-bottom: 30px;
      animation: scaleIn 0.8s ease-out 0.2s both;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .logo {
      width: 150px;
      height: 150px;
      margin: 0 auto;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(139, 69, 19, 0.3);
      border: 5px solid var(--terracotta);
      overflow: hidden;
      padding: 8px;
      position: relative;
    }

    .logo::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-dark) 100%);
      border-radius: 50%;
      z-index: -1;
      animation: rotate 3s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-size: 4rem;
      color: var(--primary-color);
      margin-bottom: 15px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      font-weight: 700;
    }

    .hero p {
      font-size: 1.5rem;
      color: var(--text-color);
      opacity: 0.8;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      margin-bottom: 40px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(139, 69, 19, 0.15);
      transition: all 0.4s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.8s ease-out both;
    }

    .card:nth-child(1) { animation-delay: 0.2s; }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-dark) 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(139, 69, 19, 0.25);
    }

    .card:hover::before {
      opacity: 0.1;
    }

    .card-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .card h2 {
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 15px;
      position: relative;
      z-index: 1;
    }

    .card p {
      font-size: 1.1rem;
      color: var(--text-color);
      opacity: 0.8;
      line-height: 1.6;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
      z-index: 1;
    }

    .card .badge {
      display: inline-block;
      background: var(--terracotta-light);
      color: var(--terracotta-dark);
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 15px;
      position: relative;
      z-index: 1;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      animation: fadeIn 1s ease-out 0.6s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .footer h3 {
      font-size: 1.8rem;
      color: var(--primary-color);
      margin-bottom: 10px;
    }

    .footer p {
      font-size: 1.1rem;
      color: var(--text-color);
      opacity: 0.8;
      font-family: 'Segoe UI', sans-serif;
    }

    .social-links {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .social-icon {
      width: 50px;
      height: 50px;
      background: white;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(139, 69, 19, 0.2);
      overflow: hidden;
      padding: 8px;
    }

    .social-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .social-icon:hover {
      transform: scale(1.15) rotate(5deg);
      box-shadow: 0 6px 20px rgba(139, 69, 19, 0.3);
    }

    .social-icon:active {
      transform: scale(0.95);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2.5rem;
      }

      .hero p {
        font-size: 1.2rem;
      }

      .logo {
        width: 120px;
        height: 120px;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 30px 20px;
      }

      .card-icon {
        font-size: 3rem;
      }

      .card h2 {
        font-size: 1.5rem;
      }
    }

    /* Loading Animation */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #FFF8F0 0%, #F0E0D0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .loading-overlay.hide {
      opacity: 0;
      pointer-events: none;
    }

    .coffee-loader {
      font-size: 4rem;
      animation: bounce 1s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="coffee-loader">☕</div>
  </div>

  <div class="container">
    <!-- Hero Section -->
    <div class="hero">
      <div class="logo-container">
        <div class="logo">
          <img src="assets/IMG-20251104-WA0038.jpg" alt="Cafe Terrain Logo">
        </div>
      </div>
      <h1>Cafe Terrain</h1>
      <p>Where Every Sip Tells a Story</p>
    </div>

    <!-- Cards Grid -->
    <div class="cards-grid">
      <!-- Customer Menu Card -->
      <a href="menu.html" class="card">
        <div class="card-icon">🍽️</div>
        <h2>View Menu</h2>
        <p>Browse our delicious selection of coffee, food, and desserts</p>
        <span class="badge">Customer Portal</span>
      </a>
    </div>

    <!-- Footer -->
    <div class="footer">
      <h3>Welcome to Cafe Terrain</h3>
      <p>Crafting moments, one cup at a time</p>
      <div class="social-links">
        <a href="https://www.facebook.com/share/1BcKeFEGwn/" class="social-icon" title="Facebook" target="_blank" rel="noopener noreferrer">
          <img src="assets/fb-removebg-preview.png" alt="Facebook">
        </a>
        <a href="https://www.instagram.com/cafe.terrain?igsh=ZGl5bm1rY2hmMTMw" class="social-icon" title="Instagram" target="_blank" rel="noopener noreferrer">
          <img src="assets/image-removebg-preview.png" alt="Instagram">
        </a>
      </div>
    </div>
  </div>

  <script>
    // Hide loading screen after page loads
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loadingOverlay').classList.add('hide');
      }, 800);
    });

    // Add click animation
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', (e) => {
        card.style.transform = 'scale(0.95)';
        setTimeout(() => {
          card.style.transform = '';
        }, 200);
      });
    });

    // Parallax effect on mouse move (disabled on mobile)
    if (window.innerWidth > 768) {
      document.addEventListener('mousemove', (e) => {
        const cards = document.querySelectorAll('.card');
        const mouseX = e.clientX / window.innerWidth;
        const mouseY = e.clientY / window.innerHeight;

        cards.forEach((card, index) => {
          const speed = (index + 1) * 2;
          const x = (mouseX - 0.5) * speed;
          const y = (mouseY - 0.5) * speed;
          card.style.transform = `translate(${x}px, ${y}px)`;
        });
      });
    }
  </script>
</body>
</html>
