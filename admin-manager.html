<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Terrain - Manager Dashboard</title>
  <link rel="preconnect" href="https://script.google.com">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #8B4513;
      --terracotta: #E2725B;
      --terracotta-dark: #C3592B;
      --success: #28a745;
      --danger: #dc3545;
      --warning: #ffc107;
      --info: #17a2b8;
      --light-bg: #FFF8F0;
      --border-color: #E7CEB9;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #FFF8F0 0%, #F0E0D0 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-dark) 100%);
      color: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .header-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
      padding: 5px;
    }

    .header-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
      font-family: Georgia, serif;
    }

    .role-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 20px;
      border-radius: 25px;
      font-size: 1rem;
      margin-bottom: 10px;
      font-weight: 600;
    }

    /* Dashboard Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(139, 69, 19, 0.15);
      border-left: 4px solid var(--terracotta);
      transition: transform 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 16px rgba(139, 69, 19, 0.25);
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .stat-icon {
      font-size: 2.5rem;
      opacity: 0.8;
    }

    .stat-title {
      font-size: 0.9rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-top: 10px;
    }

    .stat-change {
      font-size: 0.85rem;
      margin-top: 5px;
    }

    .stat-change.positive {
      color: var(--success);
    }

    .stat-change.negative {
      color: var(--danger);
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(139, 69, 19, 0.15);
    }

    .tab-btn {
      padding: 10px 20px;
      border: 2px solid var(--border-color);
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s ease;
      color: var(--primary-color);
    }

    .tab-btn:hover {
      border-color: var(--terracotta);
      background: var(--light-bg);
    }

    .tab-btn.active {
      background: var(--terracotta);
      color: white;
      border-color: var(--terracotta);
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--terracotta);
      color: white;
    }

    .btn-primary:hover {
      background: var(--terracotta-dark);
      transform: translateY(-2px);
    }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
      padding: 8px 16px;
      font-size: 0.9rem;
    }

    .btn-warning {
      background: var(--warning);
      color: #333;
      padding: 8px 16px;
      font-size: 0.9rem;
    }

    .btn-info {
      background: var(--info);
      color: white;
      padding: 8px 16px;
      font-size: 0.9rem;
    }

    .search-box {
      flex: 1;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
    }

    .table-container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(139, 69, 19, 0.15);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 15px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background: var(--light-bg);
      font-weight: 600;
      color: var(--primary-color);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    tr:hover {
      background: var(--light-bg);
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-available {
      background: #d4edda;
      color: var(--success);
    }

    .status-unavailable {
      background: #f8d7da;
      color: var(--danger);
    }

    .category-tag {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--light-bg);
      color: var(--primary-color);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      color: var(--primary-color);
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #999;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--primary-color);
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
    }

    .loading {
      text-align: center;
      padding: 40px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border-color);
      border-top-color: var(--terracotta);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .alert {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #d4edda;
      color: var(--success);
      border: 1px solid var(--success);
    }

    .alert-danger {
      background: #f8d7da;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .bulk-actions {
      margin-top: 15px;
      padding: 15px;
      background: var(--light-bg);
      border-radius: 8px;
      display: none;
    }

    .bulk-actions.show {
      display: block;
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .action-bar {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        max-width: 100%;
      }

      table {
        font-size: 0.9rem;
      }

      th, td {
        padding: 10px;
      }

      .header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-logo">
        <img src="assets/IMG-20251104-WA0038.jpg" alt="Cafe Terrain Logo" loading="lazy">
      </div>
      <span class="role-badge">👔 MANAGER</span>
      <h1>Cafe Terrain</h1>
      <p>Complete Management Dashboard</p>
    </header>

    <!-- Dashboard Statistics -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">
          <div>
            <div class="stat-title">Total Items</div>
            <div class="stat-value" id="totalItems">0</div>
          </div>
          <div class="stat-icon">📊</div>
        </div>
        <div class="stat-change positive" id="totalChange">All menu items</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <div>
            <div class="stat-title">Available</div>
            <div class="stat-value" id="availableItems">0</div>
          </div>
          <div class="stat-icon">✅</div>
        </div>
        <div class="stat-change positive" id="availableChange">Ready to serve</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <div>
            <div class="stat-title">Unavailable</div>
            <div class="stat-value" id="unavailableItems">0</div>
          </div>
          <div class="stat-icon">❌</div>
        </div>
        <div class="stat-change negative" id="unavailableChange">Out of stock</div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <div>
            <div class="stat-title">Categories</div>
            <div class="stat-value" id="totalCategories">0</div>
          </div>
          <div class="stat-icon">📁</div>
        </div>
        <div class="stat-change" id="categoryChange">Menu sections</div>
      </div>
    </div>

    <!-- Category Filter Tabs -->
    <div class="filter-tabs">
      <button class="tab-btn active" data-filter="all" onclick="filterByCategory('all')">All Items</button>
      <button class="tab-btn" data-filter="Coffee" onclick="filterByCategory('Coffee')">☕ Coffee</button>
      <button class="tab-btn" data-filter="Starters" onclick="filterByCategory('Starters')">🍟 Starters</button>
      <button class="tab-btn" data-filter="Pasta" onclick="filterByCategory('Pasta')">🍝 Pasta</button>
      <button class="tab-btn" data-filter="Continental" onclick="filterByCategory('Continental')">🍽️ Continental</button>
      <button class="tab-btn" data-filter="Dessert" onclick="filterByCategory('Dessert')">🍰 Dessert</button>
    </div>

    <div class="alert alert-success" id="successAlert"></div>
    <div class="alert alert-danger" id="errorAlert"></div>

    <div class="action-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search all menu items...">
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-primary" onclick="openAddModal()">
          ➕ Add New Item
        </button>
        <button class="btn btn-success" onclick="exportData()">
          📥 Export Data
        </button>
        <button class="btn btn-info" onclick="refreshData()">
          🔄 Refresh
        </button>
      </div>
    </div>

    <div class="table-container">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading menu data...</p>
      </div>

      <table id="menuTable" style="display: none;">
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
            <th>SL No.</th>
            <th>Category</th>
            <th>Product</th>
            <th>Price</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="menuTableBody">
        </tbody>
      </table>

      <div class="bulk-actions" id="bulkActions">
        <strong><span id="selectedCount">0</span> items selected</strong>
        <div style="margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;">
          <button class="btn btn-success" onclick="bulkEnable()">✓ Enable Selected</button>
          <button class="btn btn-warning" onclick="bulkDisable()">🔒 Disable Selected</button>
          <button class="btn btn-danger" onclick="bulkDelete()">🗑️ Delete Selected</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Item</h2>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <form id="itemForm">
        <input type="hidden" id="itemId">
        <input type="hidden" id="itemRow">

        <div class="form-group">
          <label for="category">Category *</label>
          <select id="category" required>
            <option value="">Select Category</option>
            <option value="Coffee">Coffee</option>
            <option value="Starters">Starters</option>
            <option value="Pasta">Pasta</option>
            <option value="Continental">Continental</option>
            <option value="Dessert">Dessert</option>
          </select>
        </div>

        <div class="form-group">
          <label for="product">Product Name *</label>
          <input type="text" id="product" required placeholder="Enter product name">
        </div>

        <div class="form-group">
          <label for="price">Price (₹) *</label>
          <input type="number" id="price" required placeholder="Enter price" min="0">
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status">
            <option value="✅">✅ Available</option>
            <option value="❎">❎ Unavailable</option>
          </select>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 30px;">
          <button type="submit" class="btn btn-success" style="flex: 1;">
            💾 Save Item
          </button>
          <button type="button" class="btn btn-danger" onclick="closeModal()" style="flex: 1;">
            ❌ Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw9nZs0MeIwlCb-FIR8AqjvPOG-s5THl9cfQ82Y8brh21BLeqFkKjUge2oLZKTZtWX0/exec';
    let menuData = [];
    let filteredData = [];
    let selectedItems = new Set();

    async function loadMenuItems() {
      try {
        const response = await fetch(SCRIPT_URL + '?action=getAll');
        const result = await response.json();
        
        if (result.success) {
          menuData = result.data;
          filteredData = menuData;
          updateStatistics();
          renderTable(filteredData);
        } else {
          showAlert('error', 'Failed to load menu items');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('error', 'Failed to load menu items');
      } finally {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('menuTable').style.display = 'table';
      }
    }

    function updateStatistics() {
      const total = menuData.length;
      const available = menuData.filter(item => item.status === '✅').length;
      const unavailable = total - available;
      const categories = new Set(menuData.map(item => item.category)).size;

      document.getElementById('totalItems').textContent = total;
      document.getElementById('availableItems').textContent = available;
      document.getElementById('unavailableItems').textContent = unavailable;
      document.getElementById('totalCategories').textContent = categories;

      document.getElementById('availableChange').textContent = `${((available/total)*100).toFixed(0)}% available`;
      document.getElementById('unavailableChange').textContent = `${((unavailable/total)*100).toFixed(0)}% unavailable`;
    }

    function renderTable(data) {
      const tbody = document.getElementById('menuTableBody');
      tbody.innerHTML = '';

      data.forEach((item, index) => {
        const row = tbody.insertRow();
        row.innerHTML = `
          <td><input type="checkbox" class="item-checkbox" data-row="${item.row}" onchange="updateSelection()"></td>
          <td>${item.slNo}</td>
          <td><span class="category-tag">${item.category}</span></td>
          <td>${item.product}</td>
          <td>₹ ${item.price}</td>
          <td>
            <span class="status-badge ${item.status === '✅' ? 'status-available' : 'status-unavailable'}">
              ${item.status} ${item.status === '✅' ? 'Available' : 'Unavailable'}
            </span>
          </td>
          <td class="actions">
            <button class="btn btn-warning" onclick="editItem(${index})">✏️</button>
            <button class="btn ${item.status === '✅' ? 'btn-warning' : 'btn-success'}" 
                    onclick="toggleStatus(${index})">
              ${item.status === '✅' ? '🔒' : '✓'}
            </button>
            <button class="btn btn-danger" onclick="deleteItem(${index})">🗑️</button>
          </td>
        `;
      });
    }

    function filterByCategory(category) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');

      if (category === 'all') {
        filteredData = menuData;
      } else {
        filteredData = menuData.filter(item => item.category === category);
      }
      renderTable(filteredData);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const filtered = filteredData.filter(item => 
        item.product.toLowerCase().includes(searchTerm) ||
        item.category.toLowerCase().includes(searchTerm)
      );
      renderTable(filtered);
    });

    function toggleSelectAll() {
      const selectAll = document.getElementById('selectAll').checked;
      document.querySelectorAll('.item-checkbox').forEach(cb => {
        cb.checked = selectAll;
      });
      updateSelection();
    }

    function updateSelection() {
      selectedItems.clear();
      document.querySelectorAll('.item-checkbox:checked').forEach(cb => {
        selectedItems.add(cb.dataset.row);
      });
      
      const count = selectedItems.size;
      document.getElementById('selectedCount').textContent = count;
      document.getElementById('bulkActions').classList.toggle('show', count > 0);
    }

    async function bulkEnable() {
      if (!confirm(`Enable ${selectedItems.size} items?`)) return;
      
      for (const row of selectedItems) {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'toggleStatus', row: parseInt(row), status: '✅' })
        });
      }
      showAlert('success', 'Items enabled successfully!');
      loadMenuItems();
    }

    async function bulkDisable() {
      if (!confirm(`Disable ${selectedItems.size} items?`)) return;
      
      for (const row of selectedItems) {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'toggleStatus', row: parseInt(row), status: '❎' })
        });
      }
      showAlert('success', 'Items disabled successfully!');
      loadMenuItems();
    }

    async function bulkDelete() {
      if (!confirm(`Delete ${selectedItems.size} items? This cannot be undone!`)) return;
      
      const rowsArray = Array.from(selectedItems).map(r => parseInt(r)).sort((a, b) => b - a);
      for (const row of rowsArray) {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'delete', row: row })
        });
      }
      showAlert('success', 'Items deleted successfully!');
      loadMenuItems();
    }

    function exportData() {
      const csv = [
        ['SL No', 'Category', 'Product', 'Price', 'Status'],
        ...menuData.map(item => [item.slNo, item.category, item.product, item.price, item.status])
      ].map(row => row.join(',')).join('\n');
      
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cafe-terrain-menu-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showAlert('success', 'Data exported successfully!');
    }

    function refreshData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('menuTable').style.display = 'none';
      loadMenuItems();
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add New Item';
      document.getElementById('itemForm').reset();
      document.getElementById('itemId').value = '';
      document.getElementById('itemRow').value = '';
      document.getElementById('itemModal').classList.add('active');
    }

    function editItem(index) {
      const item = filteredData[index];
      document.getElementById('modalTitle').textContent = 'Edit Item';
      document.getElementById('itemId').value = item.slNo;
      document.getElementById('itemRow').value = item.row;
      document.getElementById('category').value = item.category;
      document.getElementById('product').value = item.product;
      document.getElementById('price').value = item.price;
      document.getElementById('status').value = item.status;
      document.getElementById('itemModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('itemModal').classList.remove('active');
    }

    document.getElementById('itemForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const itemId = document.getElementById('itemId').value;
      const row = document.getElementById('itemRow').value;
      const action = itemId ? 'update' : 'add';
      
      const data = {
        action: action,
        slNo: itemId || (menuData.length + 1),
        row: row,
        category: document.getElementById('category').value,
        product: document.getElementById('product').value,
        price: document.getElementById('price').value,
        status: document.getElementById('status').value
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
          showAlert('success', `Item ${action === 'add' ? 'added' : 'updated'} successfully!`);
          closeModal();
          loadMenuItems();
        } else {
          showAlert('error', result.message || 'Operation failed');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('error', 'Operation failed');
      }
    });

    async function toggleStatus(index) {
      const item = filteredData[index];
      const newStatus = item.status === '✅' ? '❎' : '✅';
      
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'toggleStatus',
            row: item.row,
            status: newStatus
          })
        });
        
        const result = await response.json();
        
        if (result.success) {
          showAlert('success', 'Status updated successfully!');
          loadMenuItems();
        } else {
          showAlert('error', 'Failed to update status');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('error', 'Failed to update status');
      }
    }

    async function deleteItem(index) {
      const item = filteredData[index];
      
      if (!confirm(`Are you sure you want to delete "${item.product}"?`)) {
        return;
      }

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'delete',
            row: item.row
          })
        });
        
        const result = await response.json();
        
        if (result.success) {
          showAlert('success', 'Item deleted successfully!');
          loadMenuItems();
        } else {
          showAlert('error', 'Failed to delete item');
        }
      } catch (error) {
        console.error('Error:', error);
        showAlert('error', 'Failed to delete item');
      }
    }

    function showAlert(type, message) {
      const alertId = type === 'success' ? 'successAlert' : 'errorAlert';
      const alert = document.getElementById(alertId);
      alert.textContent = message;
      alert.classList.add('show');
      
      setTimeout(() => {
        alert.classList.remove('show');
      }, 5000);
    }

    document.addEventListener('DOMContentLoaded', loadMenuItems);
  </script>
</body>
</html>
